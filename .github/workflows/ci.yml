name: CI

on:
  push:

jobs:
  hello:
    name: Run hello.py
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run application
        run: python hello.py

