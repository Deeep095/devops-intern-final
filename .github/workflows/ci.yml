name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify application, script, and image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify application output
        run: test "$(python hello.py)" = "Hello, DevOps!"
      - name: Verify Linux script
        run: |
          bash -n scripts/sysinfo.sh
          ./scripts/sysinfo.sh
      - name: Build image
        run: docker build --tag ghcr.io/deeep095/devops-intern-final:${{ github.sha }} .
      - name: Verify container output
        run: test "$(docker run --rm ghcr.io/deeep095/devops-intern-final:${{ github.sha }})" = "Hello, DevOps!"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/deeep095/devops-intern-final:${{ github.sha }} ghcr.io/deeep095/devops-intern-final:latest
          docker push ghcr.io/deeep095/devops-intern-final:${{ github.sha }}
          docker push ghcr.io/deeep095/devops-intern-final:latest

